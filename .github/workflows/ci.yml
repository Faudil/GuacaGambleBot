name: Deploy to server

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test
        run: go test ./... -count=1

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          # We only copy the necessary files
          source: "cmd,internal,go.mod,go.sum,Dockerfile,docker-compose.yml,locales"
          target: "~/guacabot"

      # Step 2: Connect to build and run
      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            # Go to the folder
            cd ~/guacabot
            
            # Backup the database before redeploy
            mkdir -p ./data/backups
            cp ./data/guacabot_go.db ./data/backups/guacabot_go.db.$(date +%Y%m%d_%H%M%S) 2>/dev/null || true
            
            # Create the .env file dynamically using the GitHub Secret
            # This ensures your token is never exposed in the repo
            echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" > .env
            echo "TZ=Europe/Paris" >> .env

            # Build and Start the container
            # -d = Detached (background)
            # --build = Rebuild the image with new code
            sudo docker-compose up -d --build

            sudo docker image prune -f