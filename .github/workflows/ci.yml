name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26'

      - name: Format check
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Locale check
        run: go run ./cmd/localehelper validate

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Build the .env on the runner and transfer it as a file, so the token is
      # never interpolated into a shell command line on the production host.
      - name: Prepare .env bundle
        run: |
          printf 'DISCORD_TOKEN=%s\nTZ=Europe/Paris\n' "$DISCORD_TOKEN" > .env
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

      - name: Copy files via SCP
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          # Only the files needed to build and run are transferred.
          source: "cmd,internal,go.mod,go.sum,Dockerfile,docker-compose.yml,locales,.env"
          target: "~/guacabot"

      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USERNAME }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/guacabot

            # Backup the database before redeploy.
            mkdir -p ./data/backups
            cp ./data/guacabot_go.db ./data/backups/guacabot_go.db.$(date +%Y%m%d_%H%M%S) 2>/dev/null || true

            # Build and start the container.
            docker compose up -d --build
            docker image prune -f
